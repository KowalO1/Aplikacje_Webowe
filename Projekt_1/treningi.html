<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Tracker - Treningi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>Gym Tracker</header>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="treningi.html">Treningi</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>

    <main class="main-container">
      <h1>Historia treningów</h1>

      <section class="sekcja-dodaj-trening">
        <h2>Dodaj trening</h2>

        <form id="trainingForm">
          <label for="exercise">Ćwiczenie:</label>

          <select id="exercise" required>
            <option value="">Wybierz ćwiczenie</option>
            <option>Bench Press</option>
            <option>Squat</option>
            <option>Deadlift</option>
            <option>Overhead Press</option>
          </select>

          <label for="weight">Ciężar (kg):</label>
          <input type="number" id="weight" min="0" step="0.5" required />
          <label for="reps">Liczba powtórzeń:</label>
          <input type="number" id="reps" min="1" required />
          <button type="submit">Zapisz trening</button>
        </form>
      </section>

      <section>
        <h2>Zapisane treningi</h2>
        <ul id="trainingList"></ul>
      </section>
    </main>

    <footer>Mikołaj Kowalczyk</footer>
    <script src="index.js"></script>
  </body>
</html>
